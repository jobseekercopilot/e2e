name: jsc-user-management-beta

x-service-defaults: &service-defaults
  restart: "no"
  networks: [beta]
  security_opt: [no-new-privileges:true]

x-postgres-defaults: &postgres-defaults
  build:
    context: ./containers/postgres
  image: jsc-user-management-beta-postgres:17-alpine-no-gosu
  restart: "no"
  networks: [beta]
  security_opt: [no-new-privileges:true]

services:
  authentication-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: authentication
      POSTGRES_USER: authentication
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?run npm run stack:prepare}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentication -d authentication"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [authentication-db:/var/lib/postgresql/data]

  profile-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_DB: user_profile
      POSTGRES_USER: user_profile
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?run npm run stack:prepare}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_profile -d user_profile"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [profile-db:/var/lib/postgresql/data]

  authentication-service:
    <<: *service-defaults
    build: {context: "${AUTHENTICATION_SERVICE_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      SPRING_PROFILES_ACTIVE: local
      AUTH_DB_URL: jdbc:postgresql://authentication-db:5432/authentication
      AUTH_DB_USERNAME: authentication
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      JWT_KEY_ID: beta-local
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN}
      AUTH_ENVIRONMENT_DATA_TOKEN: ${ENVIRONMENT_DATA_TOKEN}
      ENVIRONMENT_DATA_ENABLED: "true"
      ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS: local
    depends_on:
      authentication-db: {condition: service_healthy}
    ports: ["127.0.0.1:9084:8084"]

  user-profile-service:
    <<: *service-defaults
    build: {context: "${USER_PROFILE_SERVICE_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      SPRING_PROFILES_ACTIVE: local,environment-data
      PROFILE_DB_URL: jdbc:postgresql://profile-db:5432/user_profile
      PROFILE_DB_USERNAME: user_profile
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      AUTH_JWKS_URI: http://authentication-service:8084/.well-known/jwks.json
      PROFILE_JWT_ISSUER: job-seeker-copilot-authentication
      PROFILE_JWT_AUDIENCE: job-seeker-copilot-services
      ENVIRONMENT_DATA_ENABLED: "true"
      ENVIRONMENT_DATA_TOKEN: ${ENVIRONMENT_DATA_TOKEN}
      ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS: local
    depends_on:
      profile-db: {condition: service_healthy}
      authentication-service: {condition: service_healthy}
    ports: ["127.0.0.1:9085:8085"]

  user-management-gateway:
    <<: *service-defaults
    build: {context: "${USER_MANAGEMENT_GATEWAY_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      AUTHENTICATION_SERVICE_URL: http://authentication-service:8084
      AUTHENTICATION_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN}
      USER_PROFILE_SERVICE_URL: http://user-profile-service:8085
      GATEWAY_ALLOWED_ORIGINS: http://localhost:3100
      GATEWAY_SECURE_COOKIES: "false"
    depends_on:
      authentication-service: {condition: service_healthy}
      user-profile-service: {condition: service_healthy}
    ports: ["127.0.0.1:9083:8083"]

  system-data-service:
    <<: *service-defaults
    build: {context: "${SYSTEM_DATA_SERVICE_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SYSTEM_DATA_ENVIRONMENT_MANAGEMENT_ENABLED: "true"
      SYSTEM_DATA_ENVIRONMENT_ALLOWED_PROFILES: local
      SYSTEM_DATA_INTERNAL_CALLER_KEY: ${SYSTEM_DATA_INTERNAL_CALLER_KEY}
      SYSTEM_DATA_DOWNSTREAM_ENVIRONMENT_DATA_TOKEN: ${ENVIRONMENT_DATA_TOKEN}
      SYSTEM_DATA_FIXTURES_ENABLED: "true"
      SYSTEM_DATA_FIXTURE_ALLOWED_PROFILES: local
      AUTHENTICATION_SERVICE_URL: http://authentication-service:8084
      USER_PROFILE_SERVICE_URL: http://user-profile-service:8085
      APPLICATION_TRACKER_SERVICE_URL: http://application-tracker-service:8088
      DOCUMENT_STORE_SERVICE_URL: http://document-store-service:8089
      PAYMENT_SERVICE_URL: http://payment-service:8099
    depends_on:
      authentication-service: {condition: service_healthy}
      user-profile-service: {condition: service_healthy}
    ports: ["127.0.0.1:9103:8103"]

  postcode-io-gateway:
    <<: *service-defaults
    build: {context: "${POSTCODE_IO_GATEWAY_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      DEPLOYMENT_ENVIRONMENT_CLASS: TEST
      EXTERNAL_PROVIDER_MODE: FIXTURE
      SYSTEM_DATA_SERVICE_URL: http://system-data-service:8103
      PROVIDER_MODE_ENDPOINT_ENABLED: "true"
      FIXTURE_DATASET_ID: uk-software-developer-demo
      FIXTURE_DATASET_VERSION: 1.0.0
      FIXTURE_SCENARIO: happy-path
    depends_on:
      system-data-service: {condition: service_healthy}
    ports: ["127.0.0.1:9082:8082"]

  location-gateway:
    <<: *service-defaults
    build: {context: "${LOCATION_GATEWAY_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      POSTCODE_IO_GATEWAY_URL: http://postcode-io-gateway:8082
    depends_on:
      postcode-io-gateway: {condition: service_healthy}
    ports: ["127.0.0.1:9081:8081"]

  job-seeker-copilot-client:
    <<: *service-defaults
    build: {context: "${CLIENT_REPOSITORY:?run npm run stack:prepare}"}
    environment:
      NODE_ENV: production
      PORT: "3000"
      USER_MANAGEMENT_GATEWAY_URL: http://user-management-gateway:8083
      LOCATION_GATEWAY_URL: http://location-gateway:8081
      NG_ALLOWED_HOSTS: localhost,127.0.0.1,job-seeker-copilot-client
    depends_on:
      user-management-gateway: {condition: service_healthy}
      location-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    ports: ["127.0.0.1:3100:3000"]

networks:
  beta:
    name: jsc-user-management-beta

volumes:
  authentication-db:
    name: jsc-user-management-beta-authentication-db
  profile-db:
    name: jsc-user-management-beta-profile-db
