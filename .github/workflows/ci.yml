name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run playwright:install:ci
      - run: npm run verify
        env:
          HEADLESS: "true"
          RECORD_VIDEO: "false"
          DEMO_MODE: "false"
      - name: Retain bounded smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/failures/*.png
            test-results/failures/*.json
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
      - name: Reject unaccepted Critical or High dependencies
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test fail-closed history scanning
        run: ./scripts/test-secret-history.sh
      - name: Scan complete Git history
        run: ./scripts/verify-secret-history.sh
